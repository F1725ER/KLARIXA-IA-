jobs:
  name: ARCOS_F1725_GENESIS
on: [push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear_Estructura
        run: |
          mkdir -p lib
          mkdir -p android/app/src/main
          echo 'import "package:flutter/material.dart"; void main() => runApp(MaterialApp(home: Scaffold(backgroundColor: Colors.black, body: Center(child: Text("ARCOS F1725 VIVA", style: TextStyle(color: Colors.cyanAccent))))));' > lib/main.dart
          echo '<manifest xmlns:android="http://schemas.android.com"><uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.CAMERA"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application android:label="KLARIXA F1725"><activity android:name=".MainActivity" android:exported="true"><intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter></activity></application></manifest>' > android/app/src/main/AndroidManifest.xml
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: KLARIXA-F1725-SOBERANA
          path: build/app/outputs/flutter-apk/*.apk
          
